services:
  sidedrop:
    build:
      context: .
      args: {COMMIT: "${SIDEDROP_COMMIT:-}"}  # docker compose doesn't run commands: SIDEDROP_COMMIT=$(git rev-parse --short HEAD) docker compose up --build
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: .env
    volumes: ["${DATA_DIR:-./data}:/data"]
