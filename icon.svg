<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd99b"/><stop offset=".3" stop-color="#ffa531"/><stop offset=".48" stop-color="#d0670d"/><stop offset=".52" stop-color="#b25509"/><stop offset=".8" stop-color="#d46d10"/><stop offset="1" stop-color="#f48614"/></linearGradient>
    <!-- CSS radial-gradient(circle at 50% 56%, rgba(255,255,255,.28), transparent 48%): r = farthest corner, sqrt(50²+56²) ≈ 75 -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="50" cy="56" r="75"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".48" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="29" x2="0" y2="79"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e4e9ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dy="1.6" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>
  <!-- side, then drop -->
  <path d="M20 34h28a12 12 0 0 1 12 12v22M47 61l13 13 13-13" fill="none" stroke="url(#ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
