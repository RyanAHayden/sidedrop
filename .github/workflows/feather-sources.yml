# Edit feather-sources.txt on github.com; this pushes it to the site's Feather menu.
on:
  push: { branches: [main], paths: [feather-sources.txt] }
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsS -X PUT -H "Authorization: Bearer $T" --data-binary @feather-sources.txt https://sidedrop.example.com/feather-sources
        env: { T: "${{ secrets.SIDEDROP_SYNC_TOKEN }}" }
